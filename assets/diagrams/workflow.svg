<svg xmlns="http://www.w3.org/2000/svg" width="500" height="536" viewBox="0 0 500 536" role="img" aria-labelledby="title description" color="#202020">
  <title id="title">MAY workflow</title>
  <desc id="description">Goal and project context go to a coordinator for scope, criteria, and role selection. Tier S implements inline and self-reviews with the Tech Lead lens. Tiers M and L go to named role workers, then read-only review, with a repair and re-review loop. Both routes reach acceptance checks on the reviewed candidate, then an evidence, gaps, and cleanup report. Arrows show sequence, not dispatch authority.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#777777" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#777777" stroke-width="1.2" marker-end="url(#arrow)">
      <path data-edge="goal coordinator" d="M 164 48 Q 194 47 226 48"/>
      <path data-edge="coordinator direct" d="M 260 80 L 260 104 L 82 104 Q 81 141 82 180"/>
      <path data-edge="coordinator worker" d="M 350 80 L 350 120 L 244 120 Q 243 150 244 180"/>
      <path data-edge="worker review" d="M 306 214 Q 328 213 350 214"/>
      <path data-edge="review worker" d="M 412 248 L 412 300 Q 328 301 244 300 L 244 248"/>
      <path data-edge="direct checks" d="M 82 248 Q 81 320 82 392 L 148 392"/>
      <path data-edge="review checks" d="M 474 214 L 486 214 L 486 392 L 352 392"/>
      <path data-edge="checks report" d="M 250 424 Q 249 445 250 466"/>
    </g>
  </g>
  <g fill="#ffffff" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <path data-node="goal" d="M 30 16 Q 82 15 154 17 Q 164 17 164 27 L 163 69 Q 163 80 153 79 L 30 80 Q 20 80 21 69 L 20 27 Q 20 16 30 16 Z"/>
    <path data-node="coordinator" d="M 237 16 Q 350 15 464 17 Q 474 17 474 27 L 473 69 Q 473 80 463 79 L 237 80 Q 226 80 227 69 L 226 27 Q 226 16 237 16 Z"/>
    <path data-node="direct" d="M 30 180 Q 82 179 134 181 Q 144 181 144 191 L 143 237 Q 143 248 133 247 L 30 248 Q 20 248 21 237 L 20 191 Q 20 180 30 180 Z"/>
    <path data-node="worker" d="M 192 180 Q 244 179 296 181 Q 306 181 306 191 L 305 237 Q 305 248 295 247 L 192 248 Q 182 248 183 237 L 182 191 Q 182 180 192 180 Z"/>
    <path data-node="review" d="M 360 180 Q 412 179 464 181 Q 474 181 474 191 L 473 237 Q 473 248 463 247 L 360 248 Q 350 248 351 237 L 350 191 Q 350 180 360 180 Z"/>
    <path data-node="checks" d="M 159 360 Q 250 359 342 361 Q 352 361 352 371 L 351 413 Q 351 424 341 423 L 159 424 Q 148 424 149 413 L 148 371 Q 148 360 159 360 Z"/>
    <path data-node="report" d="M 159 466 Q 250 465 342 467 Q 352 467 352 477 L 351 511 Q 351 522 341 521 L 159 522 Q 148 522 149 511 L 148 477 Q 148 466 159 466 Z"/>
  </g>
  <g fill="currentColor" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">
    <text x="92" y="42"><tspan font-weight="600">Goal</tspan><tspan x="92" dy="24" font-size="18">Project context</tspan></text>
    <text x="350" y="42"><tspan font-weight="600">Coordinator</tspan><tspan x="350" dy="24" font-size="18">Scope, criteria, roles</tspan></text>
    <text x="82" y="207" font-size="18">Implement<tspan x="82" dy="25">Self-review</tspan></text>
    <text x="244" y="207" font-size="18">Worker<tspan x="244" dy="25">implements</tspan></text>
    <text x="412" y="207" font-size="18">Read-only<tspan x="412" dy="25">review</tspan></text>
    <text x="250" y="386">Acceptance checks<tspan x="250" dy="24" font-size="18">Reviewed candidate</tspan></text>
    <text x="250" y="489">Evidence + gaps<tspan x="250" dy="23" font-size="18">Cleanup report</tspan></text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="currentColor">
    <rect x="101" y="135" width="62" height="26" rx="3" fill="#ffffff"/>
    <text x="132" y="154">Tier S</text>
    <rect x="264" y="135" width="126" height="26" rx="3" fill="#ffffff"/>
    <text x="327" y="154">Tier M/L</text>
    <rect x="239" y="310" width="178" height="26" rx="3" fill="#ffffff"/>
    <text x="328" y="329">Repair + re-review</text>
    <rect x="389" y="340" width="88" height="26" rx="3" fill="#ffffff"/>
    <text x="433" y="359">Accepted</text>
  </g>
</svg>
